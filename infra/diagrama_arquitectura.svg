<svg viewBox="0 0 1480 1000" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1480" height="1000" fill="#ffffff"/>

  <text x="30" y="34" font-size="22" font-weight="700" fill="#1a1a1a">Arquitectura propuesta en Azure — diseno de costo minimo</text>
  <text x="30" y="56" font-size="13" fill="#605e5c">Version 2: consolidada en Azure Functions + niveles gratuitos, pensada para explicarse en una entrevista junior</text>

  <!-- Column headers -->
  <text x="115" y="92" font-size="12.5" font-weight="700" fill="#6b6b6b" text-anchor="middle">FUENTES</text>
  <text x="370" y="92" font-size="12.5" font-weight="700" fill="#0078d4" text-anchor="middle">COMPUTO — AZURE FUNCTIONS</text>
  <text x="645" y="92" font-size="12.5" font-weight="700" fill="#5c2d91" text-anchor="middle">ALMACENAMIENTO</text>
  <text x="895" y="92" font-size="12.5" font-weight="700" fill="#ca5010" text-anchor="middle">RESULTADOS</text>
  <text x="1160" y="92" font-size="12.5" font-weight="700" fill="#107c10" text-anchor="middle">CONSUMO</text>

  <!-- C1 Fuentes -->
  <rect x="20" y="115" width="190" height="95" rx="8" fill="#f3f2f1" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="115" y="145" font-size="12.5" font-weight="600" fill="#201f1e" text-anchor="middle">Precios de mercado</text>
  <text x="115" y="163" font-size="11.5" fill="#484644" text-anchor="middle">Materias primas X, Y, Z</text>
  <text x="115" y="180" font-size="11.5" fill="#484644" text-anchor="middle">(proveedor externo)</text>

  <rect x="20" y="230" width="190" height="95" rx="8" fill="#f3f2f1" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="115" y="260" font-size="12.5" font-weight="600" fill="#201f1e" text-anchor="middle">Registros de compra</text>
  <text x="115" y="278" font-size="11.5" fill="#484644" text-anchor="middle">Equipo1 y Equipo2</text>
  <text x="115" y="295" font-size="11.5" fill="#484644" text-anchor="middle">(sistema interno)</text>

  <!-- C2 Azure Functions App (container) -->
  <rect x="240" y="105" width="260" height="450" rx="10" fill="#eff6fc" stroke="#0078d4" stroke-width="1.8"/>
  <text x="370" y="128" font-size="12.5" font-weight="700" fill="#201f1e" text-anchor="middle">Azure Functions App</text>
  <text x="370" y="145" font-size="11" fill="#484644" text-anchor="middle">Consumption plan</text>
  <text x="370" y="161" font-size="10.5" fill="#0078d4" text-anchor="middle">cuota gratis: 1M ejecuciones +</text>
  <text x="370" y="175" font-size="10.5" fill="#0078d4" text-anchor="middle">400.000 GB-s cada mes</text>

  <rect x="255" y="190" width="230" height="75" rx="6" fill="#ffffff" stroke="#0078d4" stroke-width="1.3"/>
  <text x="370" y="215" font-size="11.5" font-weight="600" fill="#201f1e" text-anchor="middle">Ingesta (Timer, diaria)</text>
  <text x="370" y="233" font-size="10.5" fill="#605e5c" text-anchor="middle">copia y valida datos fuente</text>
  <text x="370" y="249" font-size="10.5" fill="#605e5c" text-anchor="middle">hacia el storage</text>

  <rect x="255" y="275" width="230" height="75" rx="6" fill="#ffffff" stroke="#0078d4" stroke-width="1.3"/>
  <text x="370" y="300" font-size="11.5" font-weight="600" fill="#201f1e" text-anchor="middle">Limpieza + Analisis</text>
  <text x="370" y="318" font-size="10.5" fill="#605e5c" text-anchor="middle">notebooks 01 y 02, empaquetados</text>
  <text x="370" y="334" font-size="10.5" fill="#605e5c" text-anchor="middle">como funciones de Python</text>

  <rect x="255" y="360" width="230" height="75" rx="6" fill="#ffffff" stroke="#0078d4" stroke-width="1.3"/>
  <text x="370" y="385" font-size="11.5" font-weight="600" fill="#201f1e" text-anchor="middle">Pronostico (Timer)</text>
  <text x="370" y="403" font-size="10.5" fill="#605e5c" text-anchor="middle">Fase 3 — corre antes de cada</text>
  <text x="370" y="419" font-size="10.5" fill="#605e5c" text-anchor="middle">fase del proyecto</text>

  <rect x="255" y="445" width="230" height="90" rx="6" fill="#ffffff" stroke="#0078d4" stroke-width="1.3"/>
  <text x="370" y="470" font-size="11.5" font-weight="600" fill="#201f1e" text-anchor="middle">API de resultados</text>
  <text x="370" y="488" font-size="10.5" fill="#605e5c" text-anchor="middle">HTTP trigger, sirve el</text>
  <text x="370" y="504" font-size="10.5" fill="#605e5c" text-anchor="middle">resumen y el pronostico</text>
  <text x="370" y="520" font-size="10.5" fill="#605e5c" text-anchor="middle">(la consulta el Agente de IA)</text>

  <!-- C3 Almacenamiento -->
  <rect x="540" y="190" width="210" height="245" rx="8" fill="#f3eefa" stroke="#5c2d91" stroke-width="1.5"/>
  <text x="645" y="215" font-size="12.5" font-weight="600" fill="#201f1e" text-anchor="middle">Azure Blob Storage</text>
  <text x="645" y="232" font-size="11" fill="#484644" text-anchor="middle">(Standard, LRS)</text>
  <line x1="558" y1="245" x2="732" y2="245" stroke="#d7c7ec" stroke-width="1"/>
  <text x="558" y="268" font-size="11.5" fill="#484644">- raw/ copia fiel de la fuente</text>
  <text x="558" y="291" font-size="11.5" fill="#484644">- processed/ datasets limpios</text>
  <text x="558" y="314" font-size="11.5" fill="#484644">- models/ artefactos de pronostico</text>
  <text x="558" y="337" font-size="11.5" fill="#484644">- reports/ figuras e informes</text>
  <text x="558" y="368" font-size="10.5" fill="#7a7a7a">~5GB gratis los primeros 12 meses;</text>
  <text x="558" y="384" font-size="10.5" fill="#7a7a7a">despues, centavos de dolar al mes</text>
  <text x="558" y="400" font-size="10.5" fill="#7a7a7a">(el dataset pesa unos pocos MB)</text>

  <!-- C4 Resultados -->
  <rect x="790" y="360" width="210" height="120" rx="8" fill="#fbeee6" stroke="#ca5010" stroke-width="1.5"/>
  <text x="895" y="386" font-size="12.5" font-weight="600" fill="#201f1e" text-anchor="middle">Azure SQL Database</text>
  <text x="895" y="404" font-size="11" fill="#ca5010" text-anchor="middle">Nivel gratuito (Free offer)</text>
  <text x="895" y="424" font-size="11.5" fill="#484644" text-anchor="middle">tablas: resumen_relacion,</text>
  <text x="895" y="441" font-size="11.5" fill="#484644" text-anchor="middle">pronostico_equipos</text>
  <text x="895" y="462" font-size="10.5" fill="#7a7a7a" text-anchor="middle">hasta 32GB y 100.000 vCore-s/mes</text>

  <!-- C5 Consumo -->
  <rect x="1050" y="400" width="220" height="105" rx="8" fill="#eaf6ea" stroke="#107c10" stroke-width="1.5"/>
  <text x="1160" y="426" font-size="12.5" font-weight="600" fill="#201f1e" text-anchor="middle">Agente de IA (Fase 4)</text>
  <text x="1160" y="444" font-size="10.5" fill="#a15c00" text-anchor="middle">unico componente sin nivel</text>
  <text x="1160" y="459" font-size="10.5" fill="#a15c00" text-anchor="middle">gratuito (Azure OpenAI,</text>
  <text x="1160" y="474" font-size="10.5" fill="#a15c00" text-anchor="middle">paga por uso de tokens)</text>
  <text x="1160" y="493" font-size="10" fill="#7a7a7a" text-anchor="middle">(aun no construido)</text>

  <rect x="1050" y="525" width="220" height="85" rx="8" fill="#eaf6ea" stroke="#107c10" stroke-width="1.5"/>
  <text x="1160" y="558" font-size="12" font-weight="600" fill="#201f1e" text-anchor="middle">Evaluador / equipo de</text>
  <text x="1160" y="576" font-size="12" font-weight="600" fill="#201f1e" text-anchor="middle">planeacion financiera</text>

  <!-- Flow arrows -->
  <line x1="210" y1="192" x2="253" y2="222" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="485" y1="222" x2="538" y2="240" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="512" y="215" font-size="9.5" fill="#605e5c" text-anchor="middle">escribe raw/</text>

  <line x1="538" y1="312" x2="485" y2="312" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="485" y1="326" x2="538" y2="326" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="512" y="345" font-size="9.5" fill="#605e5c" text-anchor="middle">lee raw/, escribe processed/</text>

  <line x1="485" y1="400" x2="788" y2="400" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="636" y="392" font-size="9.5" fill="#605e5c" text-anchor="middle">escribe resultados y pronostico</text>

  <line x1="895" y1="480" x2="600" y2="480" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="600" y1="480" x2="485" y2="480" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="740" y="472" font-size="9.5" fill="#605e5c" text-anchor="middle">API lee resultados</text>

  <line x1="485" y1="490" x2="1048" y2="452" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="770" y="465" font-size="9.5" fill="#605e5c" text-anchor="middle">expone via HTTPS</text>

  <line x1="1160" y1="505" x2="1160" y2="523" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Costo estimado callout -->
  <rect x="20" y="630" width="900" height="100" rx="8" fill="#eaf6ea" stroke="#107c10" stroke-width="1.5"/>
  <text x="40" y="654" font-size="13.5" font-weight="700" fill="#0e5c0e">Costo estimado con este diseno: ~$0 / mes</text>
  <text x="40" y="674" font-size="11" fill="#28402a">- Azure Functions (Consumption): un job diario + una API de bajo trafico no se acercan a la cuota gratuita mensual.</text>
  <text x="40" y="691" font-size="11" fill="#28402a">- Azure SQL Database: nivel gratuito (Free offer), hasta 32GB y 100.000 vCore-segundos/mes.</text>
  <text x="40" y="708" font-size="11" fill="#28402a">- Azure Blob Storage: ~5GB gratis 12 meses; despues, centavos de dolar dado el tamano del dataset.</text>
  <text x="40" y="722" font-size="11" fill="#28402a">- Unico gasto real: el Agente de IA (Fase 4) paga por token, pero el uso esperado en una demo es minimo.</text>

  <!-- Cross-cutting strip -->
  <text x="30" y="760" font-size="13" font-weight="700" fill="#323130">SEGURIDAD Y OPERACION TRANSVERSAL (tambien dentro de niveles gratuitos)</text>
  <rect x="20" y="775" width="1390" height="105" rx="8" fill="#f8f8f8" stroke="#323130" stroke-width="1.2" stroke-dasharray="6,4"/>

  <rect x="35" y="793" width="320" height="65" rx="6" fill="#ffffff" stroke="#a19f9d" stroke-width="1"/>
  <text x="195" y="822" font-size="11" fill="#323130" text-anchor="middle">Azure Key Vault</text>
  <text x="195" y="838" font-size="10" fill="#605e5c" text-anchor="middle">secretos y credenciales (costo casi nulo)</text>

  <rect x="385" y="793" width="320" height="65" rx="6" fill="#ffffff" stroke="#a19f9d" stroke-width="1"/>
  <text x="545" y="822" font-size="11" fill="#323130" text-anchor="middle">Microsoft Entra ID</text>
  <text x="545" y="838" font-size="10" fill="#605e5c" text-anchor="middle">control de acceso, incluido gratis</text>

  <rect x="735" y="793" width="320" height="65" rx="6" fill="#ffffff" stroke="#a19f9d" stroke-width="1"/>
  <text x="895" y="822" font-size="11" fill="#323130" text-anchor="middle">Azure Monitor / Log Analytics</text>
  <text x="895" y="838" font-size="10" fill="#605e5c" text-anchor="middle">nivel gratuito: 5GB de datos/mes</text>

  <rect x="1085" y="793" width="310" height="65" rx="6" fill="#ffffff" stroke="#a19f9d" stroke-width="1"/>
  <text x="1240" y="822" font-size="11" fill="#323130" text-anchor="middle">GitHub Actions</text>
  <text x="1240" y="838" font-size="10" fill="#605e5c" text-anchor="middle">CI/CD gratis (repo publico o privado)</text>

  <!-- Notas -->
  <text x="30" y="908" font-size="12.5" font-weight="700" fill="#323130">Notas de diseno</text>
  <text x="30" y="928" font-size="11" fill="#484644">- Todo el computo vive en una sola Azure Functions App (4 funciones adentro) en vez de repartirlo en Data Factory + Container Apps: menos servicios que aprender, explicar y pagar.</text>
  <text x="30" y="946" font-size="11" fill="#484644">- Azure SQL Database usa el nivel gratuito en vez de Container Apps + Synapse: mismo resultado (tablas consultables) con cero costo fijo.</text>
  <text x="30" y="964" font-size="11" fill="#484644">- Se elimino Power BI de esta version para mantener el alcance minimo; la API ya sirve los datos si mas adelante se quiere agregar un dashboard.</text>
  <text x="30" y="982" font-size="11" fill="#484644">- Este diagrama sigue siendo un borrador para validar contigo; no implica ningun recurso desplegado todavia.</text>

  <text x="30" y="998" font-size="10.5" fill="#8a8a8a">Prueba tecnica — Gestion de costos operativos en un proyecto de construccion | Arquitectura propuesta (Azure, costo minimo) | Fase de diseno, sin despliegue</text>
</svg>
